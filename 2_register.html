<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKLORD · Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0d15;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      background: #11141f;
      border: 1px solid #1a2033;
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .auth-wrapper .brand { text-align: center; margin-bottom: 1.5rem; }
    .auth-wrapper .brand h2 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-wrapper .brand p { color: #6b7a9f; font-size: 0.85rem; margin-top: 0.2rem; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .auth-tabs button {
      flex: 1;
      padding: 0.6rem;
      border-radius: 12px;
      border: 1px solid #1a2033;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .auth-tabs button.active {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0b0d15;
      border-color: #fbbf24;
    }
    .auth-tabs button:hover { background: rgba(255,255,255,0.04); }
    .auth-tabs button.active:hover { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .auth-form .name-row { display: none; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .auth-form .name-row.show { display: grid; }
    .input-field {
      width: 100%;
      background: #0a0c14;
      border: 1px solid #1a2033;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: #e8edf5;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .input-field:focus { border-color: #fbbf24; }
    .input-field::placeholder { color: #4a5a7a; }
    .btn-primary {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0b0d15;
      border: none;
      padding: 0.8rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
      width: 100%;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(251, 191, 36, 0.25); }
    .btn-google {
      width: 100%;
      padding: 0.7rem;
      border-radius: 12px;
      border: 1px solid #1a2033;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    .btn-google:hover { background: rgba(255,255,255,0.04); }
    .btn-google i { color: #ea4335; font-size: 1.1rem; }
    .divider { display: flex; align-items: center; gap: 1rem; margin: 0.8rem 0; }
    .divider hr { flex: 1; border: none; border-top: 1px solid #1a2033; }
    .divider span { color: #4a5a7a; font-size: 0.75rem; font-weight: 500; }
    .flash {
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      display: none;
    }
    .flash-error { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: #f87171; }
    .flash-success { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.3); color: #34d399; }
    .flash.show { display: block; }
    .auth-link { text-align: center; margin-top: 1.2rem; font-size: 0.85rem; color: #6b7a9f; }
    .auth-link a { color: #fbbf24; text-decoration: none; font-weight: 600; }
    .auth-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="brand"><h2>⚡ BLACKLORD TECH</h2><p>Sign in to your account</p></div>
    <div class="auth-tabs">
      <button class="active" id="loginTab">Login</button>
      <button id="registerTab">Register</button>
    </div>
    <div id="flashMessage" class="flash"></div>
    <form class="auth-form" id="authForm">
      <div class="name-row" id="nameRow">
        <input class="input-field" id="signupFirst" placeholder="First Name" />
        <input class="input-field" id="signupLast" placeholder="Last Name" />
      </div>
      <input class="input-field" id="authEmail" type="email" placeholder="Email" required />
      <input class="input-field" id="authPassword" type="password" placeholder="Password" required />
      <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
    </form>
    <div class="divider"><hr /><span>or</span><hr /></div>
    <button class="btn-google" onclick="googleLogin()"><i class="fab fa-google"></i> Continue with Google</button>
    <div class="auth-link">Don't have an account? <a href="#" id="switchToRegister">Create one</a></div>
  </div>

  <script>
    let isLogin = true;
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const nameRow = document.getElementById('nameRow');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authTitle = document.querySelector('.brand p');
    const switchLink = document.getElementById('switchToRegister');
    const flash = document.getElementById('flashMessage');

    function setMode(login) {
      isLogin = login;
      if (login) {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        nameRow.classList.remove('show');
        authSubmitBtn.textContent = 'Sign In';
        authTitle.textContent = 'Sign in to your account';
        switchLink.textContent = 'Create one';
        flash.className = 'flash';
      } else {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        nameRow.classList.add('show');
        authSubmitBtn.textContent = 'Create Account';
        authTitle.textContent = 'Join BLACKLORD TECH — it\'s free';
        switchLink.textContent = 'Sign in';
        flash.className = 'flash';
      }
    }

    loginTab.addEventListener('click', () => setMode(true));
    registerTab.addEventListener('click', () => setMode(false));
    switchLink.addEventListener('click', (e) => { e.preventDefault(); setMode(!isLogin); });

    document.getElementById('authForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!email || !password) { showFlash('Email and password are required.', 'error'); return; }

      if (!isLogin) {
        const first = document.getElementById('signupFirst').value.trim();
        const last = document.getElementById('signupLast').value.trim();
        if (!first || !last) { showFlash('First and last name are required.', 'error'); return; }
        if (password.length < 6) { showFlash('Password must be at least 6 characters.', 'error'); return; }
        const users = JSON.parse(localStorage.getItem('blacklord_users') || '[]');
        if (users.find(u => u.email === email)) { showFlash('Email already registered.', 'error'); return; }
        users.push({ email, password, firstname: first, lastname: last });
        localStorage.setItem('blacklord_users', JSON.stringify(users));
        showFlash('Account created! Redirecting...', 'success');
        setTimeout(() => { window.location.href = '3_dashboard.html'; }, 800);
        return;
      }

      const users = JSON.parse(localStorage.getItem('blacklord_users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);
      if (!user) { showFlash('Invalid email or password.', 'error'); return; }
      localStorage.setItem('blacklord_current_user', JSON.stringify(user));
      showFlash('Login successful! Redirecting...', 'success');
      setTimeout(() => { window.location.href = '3_dashboard.html'; }, 600);
    });

    function showFlash(msg, type) {
      flash.textContent = msg;
      flash.className = `flash flash-${type} show`;
      setTimeout(() => { flash.className = 'flash'; }, 4000);
    }
    function googleLogin() {
      showFlash('Google sign-in simulated. Use any email/password.', 'info');
      flash.className = 'flash flash-info show';
    }
  </script>
</body>
</html>
